services:
  back:
    build: ./back
    container_name: votacions-back
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      VOTOS_FILE: /usr/src/app/data/votos.json
    volumes:
      - votos-data:/usr/src/app/data

  frontend:
    build: ./frontend
    container_name: votacions-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - back

volumes:
  votos-data:
